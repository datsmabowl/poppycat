<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poppy Cat Productions</title>
  <meta name="description" content="Poppy Cat Productions. Coming soon.">
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4eee4;
      color: #221f1b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { text-align: center; }
    h1 {
      max-width: 12ch;
      margin: 0 auto;
      font-size: clamp(3rem, 11vw, 8rem);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.055em;
    }
    p {
      margin: 2rem 0 0;
      font: 700 .75rem/1.2 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
